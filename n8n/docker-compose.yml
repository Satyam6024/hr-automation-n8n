services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: hr-automation-n8n

    ports:
      - "5678:5678"

    environment:
      - TZ=Asia/Kolkata
      - GENERIC_TIMEZONE=Asia/Kolkata

      # Allow n8n file nodes to access our mounted project folder
      - N8N_RESTRICT_FILE_ACCESS_TO=/files

    volumes:
      - n8n_data:/home/node/.n8n
      - C:/Projects/HR-Automation:/files

    restart: unless-stopped

volumes:
  n8n_data: